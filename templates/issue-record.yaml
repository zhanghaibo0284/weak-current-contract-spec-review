  对应条款或材料位置: 第一册 1.2 工程范围 / 设备材料表 第6章 数量栏 / 谈判纪要第1条
  问题描述: "设备材料表声明仅供报价参考、买方对数量不负责任；谈判纪要约定遗漏据实补齐、合同总价不变。按单站点数×站数复核，预估超投标量 AI 点约50、传感器约40只。"
  判定依据: 命中 RISK-A04 / RISK-D01 / RISK-T03；理论量按驱动因子×系数核算，偏差>5%；适用升级规则「开口条款+遗漏免费补齐」
